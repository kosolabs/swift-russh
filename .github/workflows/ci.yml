name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  functional-tests:
    name: Functional Tests
    runs-on: macos-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Wait for a release PR's binary to be pinned
      if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
      env:
        GH_TOKEN: ${{ github.token }}
        TITLE: ${{ github.event.pull_request.title }}
        PR: ${{ github.event.pull_request.number }}
        SHA: ${{ github.event.pull_request.head.sha }}
      run: .github/scripts/wait-for-release-pin.sh

    - name: Install the Rust toolchain
      working-directory: rust
      run: rustup toolchain install --no-self-update

    - id: rustc
      name: Read the Rust version
      working-directory: rust
      run: echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

    - id: core
      name: Restore the built Rust core
      uses: actions/cache@v6.1.0
      with:
        path: |
          Sources/CRusshFFI.xcframework
          .build/rust/generated
        key: rust-core-${{ runner.os }}-${{ runner.arch }}-rustc-${{ steps.rustc.outputs.version }}-${{ hashFiles('rust/**', 'build.sh') }}

    - name: Restore the Rust dependency build
      if: steps.core.outputs.cache-hit != 'true'
      uses: Swatinem/rust-cache@v2.9.3
      with:
        workspaces: rust

    - name: Build the Rust core
      if: steps.core.outputs.cache-hit != 'true'
      run: ./build.sh

    - name: Restore the generated bindings
      if: steps.core.outputs.cache-hit == 'true'
      run: cp .build/rust/generated/RusshFFI.swift Sources/RusshFFI/RusshFFI.swift

    - name: Check the committed bindings match the Rust core
      run: git diff --exit-code -- Sources/RusshFFI

    - name: Create the test server account
      run: |
        set -euxo pipefail
        sudo sysadminctl -addUser myuser -password mypass
        sudo dscl . -create /Users/myuser UserShell /bin/zsh
        sudo createhomedir -c -u myuser
        sudo dseditgroup -o edit -a myuser -t user com.apple.access_ssh

        chmod o+rx "$HOME" "$HOME/work" "$RUNNER_WORKSPACE" "$GITHUB_WORKSPACE"
        chmod 777 scripts/test_server

    - name: Start SSH test server
      run: sudo -u myuser ./scripts/start_test_server.sh

    - name: Export the test server host key
      run: sudo cat /tmp/ssh-test-server-myuser/host_key_ed25519.pub > "$RUNNER_TEMP/host_key_ed25519.pub"

    - name: Run tests
      env:
        SWIFT_LIBSSH_TEST_USER: myuser
        SWIFT_LIBSSH_TEST_PASSWORD: mypass
        SWIFT_LIBSSH_TEST_HOST_KEY_PATH: ${{ runner.temp }}/host_key_ed25519.pub
      run: swift test

    - name: Dump sshd log
      if: failure()
      run: sudo cat /tmp/ssh-test-server-myuser/sshd.log || true

    - name: Stop SSH test server
      if: always()
      run: sudo -u myuser ./scripts/stop_test_server.sh
