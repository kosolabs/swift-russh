name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: swift-russh-release
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: Iv23liXdlxbyAb7jyk9P
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app.outputs.token }}

  attach-binary:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Attach the pinned binary to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          url=$(grep -oE 'https://github\.com/[^"]+/CRusshFFI\.xcframework\.zip' Package.swift)
          checksum=$(grep -oE 'checksum: "[0-9a-f]{64}"' Package.swift | grep -oE '[0-9a-f]{64}')
          if [[ "$url" != *"/releases/download/$TAG/"* ]]; then
            echo "Package.swift points at $url, not the $TAG release"
            exit 1
          fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=CRusshFFI-$checksum" --jq '.artifacts[0].id // empty')
          if [[ -z "$id" ]]; then
            echo "No build artifact matches checksum $checksum"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > artifact.zip
          unzip -o artifact.zip
          echo "$checksum  CRusshFFI.xcframework.zip" | sha256sum --check
          gh release upload "$TAG" CRusshFFI.xcframework.zip
